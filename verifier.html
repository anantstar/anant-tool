<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>X-MAX ANANT • VERIFIER</title>
<link rel="icon" href="https://i.ibb.co/tPqBq1YV/1000031132.jpg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#000205;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;min-height:100vh;--cyan:#00f0ff;--green:#00ff88;--gold:#ffcc00;--red:#ff3366;--purple:#a855f7;--panel:rgba(2,14,7,0.97)}

.gw{position:fixed;inset:0;background:radial-gradient(circle at center,#1a0a2e 0%,#000205 100%);z-index:50000;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:25px;padding:20px}
.gwc{width:440px;max-width:95vw;background:var(--panel);border:2.5px solid var(--purple);border-radius:28px;padding:32px;text-align:center;box-shadow:0 0 80px rgba(168,85,247,0.4);display:flex;flex-direction:column;gap:18px}
.logo{width:90px;height:90px;border-radius:50%;margin:0 auto;border:2.5px solid var(--purple);object-fit:cover;box-shadow:0 0 30px var(--purple);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08);box-shadow:0 0 50px var(--cyan)}}
.gt{font-family:'Orbitron',sans-serif;color:var(--purple);font-size:15px;font-weight:900;letter-spacing:3px}
.gs{font-family:'Orbitron',sans-serif;color:#88a0aa;font-size:9px;letter-spacing:3px;text-transform:uppercase}
.ci{background:#000;border:1.5px solid rgba(168,85,247,0.5);border-radius:12px;padding:16px;color:var(--purple);font-family:'Orbitron',sans-serif;text-align:center;outline:none;font-size:14px;width:100%;letter-spacing:3px;font-weight:700}
.cb{background:linear-gradient(135deg,var(--purple),var(--cyan));color:#000;border:none;border-radius:12px;padding:16px;font-family:'Orbitron',sans-serif;font-weight:900;cursor:pointer;text-transform:uppercase;letter-spacing:2px;width:100%;font-size:14px}
.ge{color:var(--red);font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;min-height:14px}

.app{display:none;flex-direction:column;min-height:100vh}
.top{background:linear-gradient(180deg,rgba(168,85,247,0.25),rgba(2,14,7,0.98));border-bottom:1.5px solid var(--purple);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.tt{font-family:'Orbitron',sans-serif;color:var(--purple);font-size:14px;font-weight:900;letter-spacing:2px}
.mb{background:rgba(255,51,102,0.2);border:1px solid var(--red);color:var(--red);padding:8px 14px;border-radius:10px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:16px;width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.card{background:linear-gradient(135deg,rgba(168,85,247,0.1),rgba(0,240,255,0.06));border:1.5px solid rgba(168,85,247,0.35);border-radius:18px;padding:16px;text-align:center}
.cl{font-family:'Orbitron',sans-serif;font-size:9px;color:#88a0aa;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.cv{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;color:var(--purple);margin-top:8px}

.sec{background:var(--panel);border:1.5px solid rgba(168,85,247,0.35);border-radius:18px;padding:18px;margin-bottom:16px}
.sh{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--purple);font-weight:900;letter-spacing:2px;margin-bottom:14px}

.pay-card{background:rgba(0,0,0,0.5);border:1.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:14px;margin-bottom:12px}
.pay-row{display:flex;justify-content:space-between;padding:6px 0;font-size:11px;font-family:'Orbitron',sans-serif}
.pay-l{color:#88a0aa}
.pay-v{color:#fff;font-weight:700;word-break:break-all;text-align:right}
.pay-img{max-width:100%;max-height:200px;border-radius:10px;margin-top:10px;border:1px solid rgba(255,255,255,0.1)}
.pay-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{padding:12px;border-radius:10px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;letter-spacing:1.5px;cursor:pointer;border:none;text-transform:uppercase}
.btn.ok{background:linear-gradient(135deg,var(--green),var(--cyan));color:#000}
.btn.rd{background:linear-gradient(135deg,var(--red),#be123c);color:#fff}

.empty{text-align:center;padding:40px 20px;color:#88a0aa;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:1px}
</style>
</head>
<body>

<div class="gw" id="gw">
  <div class="gwc">
    <img src="https://i.ibb.co/3Ystjppg/1000031130.jpg" class="logo" alt="Anant">
    <div class="gt">X-MAX ANANT VERIFIER</div>
    <div class="gs">◆ COMMUNITY MODERATOR ◆</div>
    <input type="password" id="pwIn" class="ci" placeholder="VERIFIER PASSWORD">
    <button class="cb" onclick="login()">🔐 LOGIN</button>
    <div class="ge" id="err"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="top">
    <div class="tt">🛡️ VERIFIER PANEL</div>
    <button class="mb" onclick="logout()">LOGOUT</button>
  </div>
  <div class="wrap">
    <div class="stats">
      <div class="card"><div class="cl">PENDING</div><div class="cv" id="sPending">0</div></div>
      <div class="card"><div class="cl">APPROVED</div><div class="cv" style="color:var(--green)" id="sApproved">0</div></div>
      <div class="card"><div class="cl">EARNED (5%)</div><div class="cv" style="color:var(--gold)" id="sEarned">₹0</div></div>
    </div>

    <div class="sec">
      <div class="sh">⏳ PENDING PAYMENTS</div>
      <div id="pendingList"></div>
    </div>

    <div class="sec">
      <div class="sh">✅ APPROVED</div>
      <div id="approvedList"></div>
    </div>
  </div>
</div>

<script>
'use strict';

const MASTER_PW = 'ANANT-VERIFIER-2026';
const PAY_STORE = 'anant_payments_v9';
const COMMISSION = 0.05;

function toast(m) {
  let e = document.getElementById('tst');
  if (!e) {
    e = document.createElement('div');
    e.id = 'tst';
    e.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#a855f7,#00f0ff);color:#000;padding:14px 24px;border-radius:14px;font-family:Orbitron,sans-serif;font-weight:900;font-size:11px;z-index:999999;letter-spacing:1px';
    document.body.appendChild(e);
  }
  e.textContent = m; e.style.display = 'block';
  clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 2500);
}

function login() {
  const pw = (document.getElementById('pwIn').value || '').trim();
  if (pw !== MASTER_PW) { document.getElementById('err').innerText = '❌ WRONG PASSWORD'; return; }
  document.getElementById('gw').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderAll();
}

function logout() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('gw').style.display = 'flex';
  document.getElementById('pwIn').value = '';
}

function getPayments() {
  try { return JSON.parse(localStorage.getItem(PAY_STORE) || '[]'); } catch(e) { return []; }
}
function savePayments(p) { localStorage.setItem(PAY_STORE, JSON.stringify(p)); }

function renderAll() {
  const p = getPayments();
  const pending = p.filter(x => x.status === 'PENDING');
  const approved = p.filter(x => x.status === 'APPROVED');
  const earned = approved.reduce((s, x) => s + (x.amount || 0) * COMMISSION, 0);
  document.getElementById('sPending').textContent = pending.length;
  document.getElementById('sApproved').textContent = approved.length;
  document.getElementById('sEarned').textContent = '₹' + Math.round(earned);

  const pl = document.getElementById('pendingList');
  if (!pending.length) { pl.innerHTML = '<div class="empty">No pending payments ✅</div>'; }
  else {
    pl.innerHTML = pending.map(pm => {
      const d = new Date(pm.timestamp);
      return '<div class="pay-card">' +
        '<div class="pay-row"><span class="pay-l">Time</span><span class="pay-v">' + d.toLocaleString() + '</span></div>' +
        '<div class="pay-row"><span class="pay-l">Method</span><span class="pay-v">' + pm.method.toUpperCase() + '</span></div>' +
        '<div class="pay-row"><span class="pay-l">Amount</span><span class="pay-v">₹' + pm.amount + '</span></div>' +
        '<div class="pay-row"><span class="pay-l">UTR</span><span class="pay-v">' + pm.utr + '</span></div>' +
        '<div class="pay-row"><span class="pay-l">User Key</span><span class="pay-v">' + (pm.key || 'N/A') + '</span></div>' +
        (pm.screenshot ? '<img src="' + pm.screenshot + '" class="pay-img">' : '') +
        '<div class="pay-actions">' +
          '<button class="btn ok" onclick="approve(\'' + pm.id + '\')">✅ APPROVE</button>' +
          '<button class="btn rd" onclick="reject(\'' + pm.id + '\')">❌ REJECT</button>' +
        '</div></div>';
    }).join('');
  }

  const al = document.getElementById('approvedList');
  if (!approved.length) { al.innerHTML = '<div class="empty">No approved yet</div>'; }
  else {
    al.innerHTML = approved.slice(-5).reverse().map(pm => {
      const d = new Date(pm.approvedAt || pm.timestamp);
      return '<div class="pay-card" style="border-color:rgba(0,255,136,0.3)">' +
        '<div class="pay-row"><span class="pay-l">Approved</span><span class="pay-v" style="color:var(--green)">' + d.toLocaleString() + '</span></div>' +
        '<div class="pay-row"><span class="pay-l">Method</span><span class="pay-v">' + pm.method.toUpperCase() + '</span></div>' +
        '<div class="pay-row"><span class="pay-l">Amount</span><span class="pay-v">₹' + pm.amount + '</span></div>' +
        '<div class="pay-row"><span class="pay-l">Your Commission</span><span class="pay-v" style="color:var(--gold)">₹' + Math.round(pm.amount * COMMISSION) + '</span></div>' +
        '</div>';
    }).join('');
  }
}

function approve(id) {
  const p = getPayments();
  const idx = p.findIndex(x => x.id === id);
  if (idx === -1) return;
  p[idx].status = 'APPROVED';
  p[idx].approvedAt = Date.now();
  savePayments(p);
  renderAll();
  toast('✅ Approved! Commission: ₹' + Math.round(p[idx].amount * COMMISSION));
}

function reject(id) {
  if (!confirm('Reject this payment?')) return;
  const p = getPayments();
  const idx = p.findIndex(x => x.id === id);
  if (idx === -1) return;
  p[idx].status = 'REJECTED';
  savePayments(p);
  renderAll();
  toast('❌ Rejected');
}

document.getElementById('pwIn').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
